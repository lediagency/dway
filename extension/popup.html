<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <style>
    body { margin: 0; width: 280px; font: 13px/1.45 system-ui, -apple-system, 'Segoe UI', sans-serif; color: #f4f2ec; background: #08080a; }
    main { padding: 16px; background: radial-gradient(120% 80% at 0% 0%, rgb(255 255 255 / 0.09), transparent 60%); }
    header { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: 0.2em; }
    .card { margin-top: 14px; padding: 12px 14px; border-radius: 14px; border: 1px solid rgb(255 255 255 / 0.09); background: rgb(255 255 255 / 0.05); }
    .eyebrow { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: #8d8b85; }
    #status { margin-top: 6px; }
    #when { margin-top: 2px; color: #8d8b85; font-size: 12px; }
    button, a { display: block; box-sizing: border-box; width: 100%; margin-top: 10px; padding: 10px; border-radius: 12px; font: inherit; font-weight: 500; text-align: center; text-decoration: none; cursor: pointer; }
    button { border: 0; color: #09090b; background: linear-gradient(180deg, #fff, #d4d4d8); }
    button:disabled { opacity: 0.6; cursor: default; }
    a { color: #f4f2ec; border: 1px solid rgb(255 255 255 / 0.09); background: rgb(255 255 255 / 0.04); }
    p.note { margin: 12px 0 0; font-size: 11px; color: #8d8b85; }
  </style>
</head>
<body>
  <main>
    <header><img src="icon-48.png" width="24" height="24" alt="" />DWAY</header>
    <div class="card">
      <div class="eyebrow">Synchronisation Uber</div>
      <div id="status">Pas encore synchronisé.</div>
      <div id="when"></div>
    </div>
    <button id="sync">Synchroniser maintenant</button>
    <a id="open" target="_blank">Ouvrir DWAY</a>
    <p class="note">Mise à jour automatique toutes les 3 heures, et chaque fois que tu ouvres ton historique Uber.</p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
